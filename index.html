<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GA4 Direct Event Test Page</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-652Z7G2TSM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Add to Cart
gtag('event', 'add_to_cart', {
  'mock_event_test': 'add_to_cart', // Match key to GA4
  currency: 'USD',
  value: 29.99
});

// Purchase
gtag('event', 'purchase', {
  'mock_event_test': 'purchase', // Match key to GA4
  currency: 'USD',
  value: 34.99
});// Configures GA4 and forces Debug Mode for DebugView testing
    gtag('config', 'G-652Z7G2TSM', {
      'debug_mode': true
    });
  </script>
</head>
<body>

  <h2>GA4 Direct Event Testing Panel</h2>

  <!-- Action Buttons -->
  <button id="btn-add-to-cart" onclick="triggerAddToCart()">Add to Cart</button>
  <button id="btn-purchase" onclick="triggerPurchase()">Simulate Purchase</button>

  <script>
    // Trigger GA4 add_to_cart event
    function triggerAddToCart() {
      gtag('event', 'add_to_cart', {
        'mock_event_test': 'add_to_cart', // Updated parameter key
        currency: 'USD',
        value: 29.99,
        items: [
          {
            item_id: 'SKU_12345',
            item_name: 'Classic T-Shirt',
            item_category: 'Apparel',
            price: 29.99,
            quantity: 1
          }
        ]
      });
      console.log('add_to_cart sent directly to GA4');
    }

    // Trigger GA4 purchase event
    function triggerPurchase() {
      gtag('event', 'purchase', {
        'mock_event_test': 'purchase', // Updated parameter key
        transaction_id: 'T_' + Math.floor(Math.random() * 1000000), // Generates unique ID
        value: 34.99,
        tax: 2.50,
        shipping: 2.50,
        currency: 'USD',
        items: [
          {
            item_id: 'SKU_12345',
            item_name: 'Classic T-Shirt',
            item_category: 'Apparel',
            price: 29.99,
            quantity: 1
          }
        ]
      });
      console.log('purchase sent directly to GA4');
    }
  </script>

</body>
</html>
