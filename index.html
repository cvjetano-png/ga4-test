<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <!-- Google tag (gtag.js) with Debug Mode enabled -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-652Z7G2TSM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Initializing GA4 with Debug Mode ON
      gtag('config', 'G-652Z7G2TSM', {
        'debug_mode': true
      });
    </script>
</head>
<body>

    <h1>Welcome to My Website</h1>
    
    <!-- Example custom event trigger button -->
    <button id="testEventBtn">Trigger Test Event</button>

    <script>
      // Optional: Example script to trigger a custom event on click
      document.getElementById('testEventBtn').addEventListener('click', function() {
        gtag('event', 'test_button_click', {
          'event_category': 'testing',
          'event_label': 'debug_view_test'
        });
        console.log('Test event sent to GA4 DebugView');
      });
    </script>

</body>
</html>
